# nplex configuration file.
# see https://github.com/torrentg/nplex

# Local address for the nplex server to bind to
addr = localhost:14022
# Logging level (trace|debug|info|warn|error|fatal)
log-level = info
# Whether to use fsync for writes (true|false)
fsync = false

# Maximum number of concurrent sessions (0 for unlimited)
max-sessions = 64
# Limits the number of updates in a single network message (0 for unlimited)
msg-max-bytes = 2MB
# Maximum queued updates awaiting disk write (0 for unlimited)
write-queue-max-entries = 1000
# Maximum queued bytes awaiting disk writing (0 for unlimited)
write-queue-max-bytes = 350MB
# Maximum updates per disk write batch (0 for unlimited)
write-flush-max-entries = 50
# Maximum bytes per disk write batch (0 for unlimited)
write-flush-max-bytes = 25MB
# Maximum number of tombstones. When exceeded, the oldest tombstones are purged (0 for unlimited)
tombstone-max-entries = 1500
# Maximum tombstone age in revisions before eligible for purging (0 for unlimited)
tombstone-max-age = 20000
# Minimum tombstone age in revisions before eligible for purging
tombstone-min-age = 5
# Maximum number of updates in the in-memory cache (0 for unlimited)
cache-max-entries = 50000
# Maximum number of bytes in the in-memory cache (0 for unlimited)
cache-max-bytes = 500MB
# Recommended maximum number of journal entries (0 for unlimited)
journal-max-entries = 100000
# Recommended maximum journal size in bytes (0 for unlimited)
journal-max-bytes = 100MB
# Recommended maximum cumulated update entries (0 for unlimited)
snapshot-max-entries = 50000
# Recommended maximum snapshot size in bytes (0 for unlimited)
snapshot-max-bytes = 50MB

[user-defaults]
# Enables or disables the user account (true|false)
active = true
# Allows committing transactions despite conflicts (true|false)
can-force = false
# Allows monitoring events from other sessions (true|false)
can-monitor = false
# Maximum number of concurrent connections for the user (0 for unlimited)
max-connections = 5
# Maximum idle time before sending a keepalive, in milliseconds (0 to disable)
keepalive-millis = 1000
# Timeout factor for the user (multiplier for keepalive interval)
timeout-factor = 3.0
# Disconnect the client if the number of unacknowledged messages exceeds this limit (0 for unlimited)
max-unack-msg = 1000
# Disconnect the client if unacknowledged data exceeds this limit (0 for unlimited)
max-unack-bytes = 100MB

[admin]
password = s3cr3t
can-force = true
can-monitor = true
keepalive-millis = 250
timeout-factor = 0.0
max-connections = 256
acl = crud:**

